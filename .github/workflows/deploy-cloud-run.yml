name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }} # Define this in GitHub Secrets
  REGION: us-central1 # Update to your desired Google Cloud Region
  SERVICE_NAME: performance-telemetry-service # Update to your desired Cloud Run service name

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write' # Required for Google Workload Identity Federation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------------------------------------------------------------------
      # Authentication
      #
      # Option 1: Workload Identity Federation (Recommended, passwordless)
      # Uncomment this block and configure Workload Identity Federation in GCP.
      # -------------------------------------------------------------------------------------
      # - name: Authenticate to Google Cloud (Workload Identity Federation)
      #   id: auth
      #   uses: google-github-actions/auth@v2
      #   with:
      #     workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
      #     service_account: 'my-service-account@my-project.iam.gserviceaccount.com'

      # -------------------------------------------------------------------------------------
      # Option 2: Service Account JSON Key (Simpler, but requires managing a secret key)
      # Make sure to add GCP_CREDENTIALS as a repository secret containing the JSON key.
      # -------------------------------------------------------------------------------------
      - name: Authenticate to Google Cloud (Service Account Key)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use Google Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Docker image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}"
          docker build -t $IMAGE_PATH:${{ github.sha }} -t $IMAGE_PATH:latest .
          docker push $IMAGE_PATH:${{ github.sha }}
          docker push $IMAGE_PATH:latest

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
          # Optionally configure secrets like GEMINI_API_KEY from Google Secret Manager
          # secrets: |
          #   GEMINI_API_KEY=projects/${{ env.PROJECT_ID }}/secrets/gemini_api_key/versions/latest
          #   QA_API_KEY=projects/${{ env.PROJECT_ID }}/secrets/qa_api_key/versions/latest

      - name: Show Output
        run: echo "Deployment successful! Service URL is ${{ steps.deploy.outputs.url }}"
